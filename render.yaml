services:
  - type: web
    runtime: docker
    name: block-bug-backend
    repo: https://github.com/miansannan03/Block-Bug.git
    branch: postgres-only
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: block-bug-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: BLOCKCHAIN_ENABLED
        value: "false"

databases:
  - name: block-bug-db
    databaseName: blockbug
    plan: free
    region: oregon
